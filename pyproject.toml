[tool.poetry]
name = "panos-diff-tool"
version = "0.1.0"
description = "A Python CLI tool to compare Palo Alto PAN-OS configurations between two versions, highlighting changes in security rulebases and objects."
authors = ["lukaszszszsz "]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "panos_diff" }]
keywords = ["palo-alto", "pan-os", "diff", "security", "cli"]

[tool.poetry.dependencies]
python = "^3.10"
lxml = "^5.1.0"
rich = "^13.7.0"
click = "^8.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"

[tool.poetry.scripts]
panos-diff = "panos_diff.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"